<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # public/.htaccess sends every request to index.php.
        AllowOverride All
        Require all granted
    </Directory>

    # Logs go to the container output, which Render shows under "Logs".
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
