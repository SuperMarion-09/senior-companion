<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kaagapay social post: service spotlight</title>
  <!-- 1080 × 1080 "service spotlight" post. Change the icon, title and text
       for each of the six services in frontend/src/content/siteContent.js. -->
  <style>
    @font-face { font-family: 'Source Serif 4'; font-weight: 600; src: url('../assets/fonts/source-serif-4-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 400; src: url('../assets/fonts/atkinson-hyperlegible-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 700; src: url('../assets/fonts/atkinson-hyperlegible-latin-700-normal.woff2') format('woff2'); }
    html, body { margin: 0; background: #4e6e55; }
    .post { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: #4e6e55; font-family: 'Atkinson Hyperlegible', Arial, sans-serif; color: #fff; }
    .glow { position: absolute; left: -240px; top: -240px; width: 760px; height: 760px; border-radius: 50%; background: #5a7c61; }
    .logo { position: absolute; left: 88px; top: 92px; height: 62px; }
    .badge { position: absolute; right: 88px; top: 92px; padding: 12px 24px; border-radius: 999px; background: #f3d9a4; color: #3d5843; font-size: 26px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .icon { position: absolute; left: 88px; top: 300px; display: grid; place-items: center; width: 150px; height: 150px; border-radius: 40px; background: #fbf8f1; color: #4e6e55; }
    .icon svg { width: 92px; height: 92px; }
    h1 { position: absolute; left: 88px; top: 500px; margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 104px; line-height: 1.02; letter-spacing: -0.015em; }
    p.body { position: absolute; left: 88px; top: 740px; width: 820px; margin: 0; font-size: 36px; line-height: 1.45; color: #e7eee4; }
    .foot { position: absolute; left: 88px; right: 88px; bottom: 80px; display: flex; justify-content: space-between; align-items: center; padding-top: 30px; border-top: 2px solid rgba(255,255,255,0.25); font-size: 30px; }
    .foot strong { color: #f3d9a4; }
  </style>
</head>
<body>
  <div class="post">
    <div class="glow"></div>
    <img class="logo" src="../logos/kaagapay-logo-horizontal-white.svg" alt="Kaagapay">
    <span class="badge">Service spotlight</span>
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 14v-2.4C5 9.5 4 8.5 4 6c0-2.7 1.5-4.5 3.5-4.5S10 3.5 10 6c0 2.2-1 3.5-1 6v2z"/><path d="M5 14h4v1.5a2 2 0 0 1-4 0z"/><path d="M19 19v-2.4c0-2.1 1-3.1 1-5.6 0-2.7-1.5-4.5-3.5-4.5S14 8.5 14 11c0 2.2 1 3.5 1 6v2z"/><path d="M15 19h4v1.5a2 2 0 0 1-4 0z"/></svg></div>
    <h1>Walking<br>Companion</h1>
    <p class="body">A steady arm and good conversation for a morning walk in the park, so Lolo and Lola can stay active safely.</p>
    <div class="foot"><span>Book online in about five minutes</span><strong>kaagapay.example</strong></div>
  </div>
</body>
</html>
